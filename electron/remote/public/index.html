<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TV Remote</title>
    <link rel="stylesheet" href="remote.css" />
  </head>
  <body>
    <main class="remote">
      <header class="top">
        <div class="status" id="status" data-state="wait">
          <span class="dot"></span>
          <span id="status-text">Connecting…</span>
        </div>
        <div class="top-actions">
          <button class="icon-btn" data-nav="refresh" aria-label="Refresh page">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66L20 8.5" /><path d="M20 3.5v5h-5" /></svg>
          </button>
          <button class="icon-btn power" id="power" aria-label="Turn off">
            <svg viewBox="0 0 24 24"><path d="M12 3v9" /><path d="M17.66 6.34a8 8 0 1 1-11.32 0" /></svg>
          </button>
        </div>
      </header>

      <section class="trackpad" id="trackpad" aria-label="Trackpad">
        <div class="trackpad-hint">
          <svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10l4.6.9a2 2 0 0 1 1.6 2.2l-.7 5.4A2 2 0 0 1 15.5 20H11a2 2 0 0 1-1.6-.8l-3.6-4.7a1.5 1.5 0 0 1 2.2-2z" /></svg>
          <span>Drag to move · Tap to click</span>
          <span class="sub">Two fingers to scroll</span>
        </div>
        <div class="touch-dot" id="touch-dot"></div>
      </section>

      <section class="row nav-row">
        <button class="key" data-nav="back">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
          Back
        </button>
        <button class="key" data-nav="home">
          <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" /></svg>
          Home
        </button>
        <button class="key" data-nav="forward">
          Forward
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg>
        </button>
      </section>

      <section class="row media-row">
        <button class="round" data-key="Left" aria-label="Skip back">
          <svg viewBox="0 0 24 24" class="filled"><path d="M11 6.5v11L3.5 12zM20.5 6.5v11L13 12z" /></svg>
        </button>
        <button class="round play" data-key="Space" aria-label="Play or pause">
          <svg viewBox="0 0 24 24" class="filled"><path d="M3.5 6v12l8-6z" /><rect x="14" y="6" width="2.6" height="12" rx="1" /><rect x="18.4" y="6" width="2.6" height="12" rx="1" /></svg>
        </button>
        <button class="round" data-key="Right" aria-label="Skip forward">
          <svg viewBox="0 0 24 24" class="filled"><path d="M13 6.5v11l7.5-5.5zM3.5 6.5v11L11 12z" /></svg>
        </button>
      </section>

      <section class="volume">
        <button class="icon-btn" id="mute" aria-label="Mute">
          <svg viewBox="0 0 24 24" class="vol-on"><path d="M11 5 6.5 9H3.5v6h3L11 19z" /><path d="M15.5 9a4 4 0 0 1 0 6" /><path d="M18.5 6.5a8 8 0 0 1 0 11" /></svg>
          <svg viewBox="0 0 24 24" class="vol-off"><path d="M11 5 6.5 9H3.5v6h3L11 19z" /><path d="M16 9.5l5 5M21 9.5l-5 5" /></svg>
        </button>
        <input type="range" id="volume" min="0" max="100" step="1" value="50" aria-label="Volume" />
        <span class="volume-value" id="volume-value">50</span>
      </section>

      <button class="type-btn" id="open-keyboard">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5" /><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8" /></svg>
        Type
      </button>
    </main>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-backdrop" id="sheet-backdrop"></div>
      <div class="sheet-panel" role="dialog" aria-label="Type on TV">
        <div class="sheet-head">
          <span>Type on TV</span>
          <button class="done" id="close-keyboard">Done</button>
        </div>
        <input
          id="type-input"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="go"
          placeholder="Start typing…"
        />
        <p class="sheet-note">Letters appear in the selected text box on the TV.</p>
        <div class="sheet-keys">
          <button class="key" id="key-delete">
            <svg viewBox="0 0 24 24"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z" /><path d="M12 9.5l5 5M17 9.5l-5 5" /></svg>
            Delete
          </button>
          <button class="key" id="key-enter">
            Enter
            <svg viewBox="0 0 24 24"><path d="M19 5v7a2 2 0 0 1-2 2H6" /><path d="M10 10l-4 4 4 4" /></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="off-screen" id="off-screen" hidden>
      <button class="power-on" id="power-on" aria-label="Turn on">
        <svg viewBox="0 0 24 24"><path d="M12 3v9" /><path d="M17.66 6.34a8 8 0 1 1-11.32 0" /></svg>
      </button>
      <h1 id="off-title">TV is off</h1>
      <p id="off-text">Tap to turn it on.</p>
    </div>

    <script src="remote.js"></script>
  </body>
</html>
