<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>TV Remote</title>
    <link rel="stylesheet" href="remote.css" />
  </head>
  <body>
    <main class="remote">
      <header class="top">
        <div class="status" id="status" data-state="wait">
          <span class="dot"></span>
          <span id="status-text">Connecting…</span>
        </div>
        <div class="top-actions">
          <button class="icon-btn" data-nav="back" aria-label="Back">
            <i data-icon="back"></i>
          </button>
          <button class="icon-btn" data-nav="forward" aria-label="Forward">
            <i data-icon="forward"></i>
          </button>
          <button class="icon-btn" data-nav="refresh" aria-label="Refresh page">
            <i data-icon="refresh"></i>
          </button>
          <button class="icon-btn power" id="power" aria-label="Turn off">
            <i data-icon="power"></i>
          </button>
        </div>
      </header>

      <section class="trackpad" id="trackpad" aria-label="Trackpad">
        <div class="trackpad-hint">
          <i data-icon="hand"></i>
          <span>Drag to move · Tap to click</span>
          <span class="sub">Two fingers to scroll</span>
        </div>
        <div class="touch-dot" id="touch-dot"></div>
      </section>

      <section class="row nav-row">
        <button class="key wrap" data-key="F" aria-label="Full screen">
          <i data-icon="fullscreen"></i>
          <span>Full screen</span>
        </button>
        <button class="key" data-nav="home">
          <i data-icon="home"></i>
          Home
        </button>
        <button class="key wrap" data-key="Escape" aria-label="Exit full screen">
          <i data-icon="exit-fullscreen"></i>
          <span>Exit full screen</span>
        </button>
      </section>

      <section class="row media-row">
        <button class="round" data-key="Left" aria-label="Skip back">
          <i data-icon="skip-back" class="filled"></i>
        </button>
        <button class="round play" data-key="Space" aria-label="Play or pause">
          <i data-icon="play-pause" class="filled"></i>
        </button>
        <button class="round" data-key="Right" aria-label="Skip forward">
          <i data-icon="skip-forward" class="filled"></i>
        </button>
      </section>

      <section class="volume">
        <button class="icon-btn" id="mute" aria-label="Mute">
          <i data-icon="volume" class="vol-on"></i>
          <i data-icon="mute" class="vol-off"></i>
        </button>
        <input type="range" id="volume" min="0" max="100" step="1" value="50" aria-label="Volume" />
        <span class="volume-value" id="volume-value">50</span>
      </section>

      <button class="type-btn" id="open-keyboard">
        <i data-icon="keyboard"></i>
        Type
      </button>
    </main>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-backdrop" id="sheet-backdrop"></div>
      <div class="sheet-panel" role="dialog" aria-label="Type on TV">
        <div class="sheet-head">
          <span>Type on TV</span>
          <button class="done" id="close-keyboard">Done</button>
        </div>
        <input
          id="type-input"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="go"
          placeholder="Start typing…"
        />
        <p class="sheet-note">Letters appear in the selected text box on the TV.</p>
        <div class="sheet-keys">
          <button class="key" id="key-delete">
            <i data-icon="delete"></i>
            Delete
          </button>
          <button class="key" id="key-enter">
            Enter
            <i data-icon="enter"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="off-screen" id="off-screen" hidden>
      <button class="power-on" id="power-on" aria-label="Turn on">
        <i data-icon="power"></i>
      </button>
      <h1 id="off-title">TV is off</h1>
      <p id="off-text">Tap to turn it on.</p>
    </div>

    <script src="remote.js"></script>
  </body>
</html>
